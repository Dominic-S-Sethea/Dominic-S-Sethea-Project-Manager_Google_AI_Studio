<!DOCTYPE html>
<html lang="en" class="dark" data-pm-theme="crystal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B11" />
    <title>Project Manager</title>
    <script>
      (function () {
        var STORAGE_KEY = "pm-theme-preference-v2";
        var presets = {
          crystal: "#54C8FF",
          obsidian: "#54C8FF",
          violet: "#C7A6FF",
          prism: "#C7A6FF",
          aurora: "#87E2C0",
          ember: "#FFC47A",
          emerald: "#67E7AD",
          juniper: "#67E7AD",
          porcelain: "#4773D8"
        };
        var canonical = {
          crystal: "crystal",
          obsidian: "crystal",
          violet: "violet",
          prism: "violet",
          aurora: "aurora",
          ember: "ember",
          emerald: "emerald",
          juniper: "emerald",
          porcelain: "porcelain"
        };
        var hexPattern = /^#?([0-9a-fA-F]{6})$/;
        function normalizeHex(value) {
          var match = String(value || "").trim().match(hexPattern);
          return match ? "#" + match[1].toUpperCase() : null;
        }
        function luminance(hexValue) {
          var values = [hexValue.slice(1, 3), hexValue.slice(3, 5), hexValue.slice(5, 7)].map(function (part) {
            var channel = parseInt(part, 16) / 255;
            return channel <= 0.04045 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * values[0] + 0.7152 * values[1] + 0.0722 * values[2];
        }
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          var parsed = raw ? JSON.parse(raw) : null;
          var rawTheme = (parsed && (parsed.theme || parsed.preset)) || localStorage.getItem("pm-ui-theme") || "crystal";
          var theme = canonical[rawTheme] || "crystal";
          var customHex = normalizeHex((parsed && parsed.accent) || localStorage.getItem("pm-ui-custom-accent"));
          var accent = customHex || presets[theme] || "#54C8FF";
          var red = parseInt(accent.slice(1, 3), 16);
          var green = parseInt(accent.slice(3, 5), 16);
          var blue = parseInt(accent.slice(5, 7), 16);
          document.documentElement.dataset.pmTheme = theme;
          document.documentElement.classList.toggle("dark", theme !== "porcelain");
          document.documentElement.style.setProperty("--pm-accent", accent);
          document.documentElement.style.setProperty("--pm-accent-rgb", red + ", " + green + ", " + blue);
          document.documentElement.style.setProperty("--pm-accent-ink", luminance(accent) > 0.42 ? "#06131A" : "#F7FCFF");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
