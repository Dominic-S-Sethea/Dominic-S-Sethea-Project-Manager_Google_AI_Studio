name: CI/CD — Project Manager

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Typecheck backend
        run: npm run typecheck --prefix backend
      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend
      - name: Backend unit tests
        run: npm run test --prefix backend
      - name: Frontend build
        run: npm run build --prefix frontend

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        run: |
          docker compose up -d --pull always
          sleep 10
      - name: Verify health
        run: curl -fsS http://localhost:4000/health
      - name: Post deploy summary
        run: echo "Staging OK @ ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production
        run: |
          docker compose up -d --pull always
          sleep 10
      - name: Verify API health
        run: curl -fsS http://localhost:4000/health
      - name: Verify SPA served
        run: curl -fsS http://localhost:4000/ | grep -q "Project Manager"
      - name: Post deploy summary
        run: echo "Production OK @ ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
